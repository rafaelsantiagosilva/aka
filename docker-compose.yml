services:
  redis:
    image: redis:7.4-alpine
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - ./docker_data/redis:/data
  postgresql:
    image: postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: aka_db
    ports:
      - "5433:5432"
    volumes:
      - ./docker_data/postgres:/var/lib/postgresql/data
